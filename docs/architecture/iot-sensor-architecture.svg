<text x="855" y="1010" font-family="Arial, sans-serif" font-size="23" fill="#334155" font-weight="700">Web IoT monitoring</text>
<text x="855" y="1046" font-family="Arial, sans-serif" font-size="18" fill="#334155" font-weight="400">Sensor trends + threat alerts</text>
<text x="855" y="1072" font-family="Arial, sans-serif" font-size="18" fill="#334155" font-weight="400">Admin: devices / thresholds</text>
<text x="855" y="1098" font-family="Arial, sans-serif" font-size="18" fill="#334155" font-weight="400">Officer: review / respond</text>
<polyline points="985,885 985,970" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="55" y="710" font-family="Arial, sans-serif" font-size="20" fill="#0f766e" font-weight="700">FIRMWARE CONNECTIONS</text>
<text x="55" y="755" font-family="Arial, sans-serif" font-size="20" fill="#334155" font-weight="400">DHT11 GPIO4 | Soil GPIO35</text>
<text x="55" y="790" font-family="Arial, sans-serif" font-size="20" fill="#334155" font-weight="400">Rain GPIO34 | LED GPIO5</text>
<text x="55" y="825" font-family="Arial, sans-serif" font-size="20" fill="#334155" font-weight="400">MPU6050 uses I2C</text>
<text x="55" y="970" font-family="Arial, sans-serif" font-size="20" fill="#334155" font-weight="400">Local movement also drives the LED.</text>
<text x="55" y="1005" font-family="Arial, sans-serif" font-size="20" fill="#334155" font-weight="400">Select USB or Wi-Fi as the upload path.</text>
<text x="55" y="1183" font-family="Arial, sans-serif" font-size="18" fill="#475569" font-weight="400">Wi-Fi uploads require configuration; the ESP32 does not persist unsent packets while disconnected.</text>
<text x="55" y="1210" font-family="Arial, sans-serif" font-size="18" fill="#475569" font-weight="400">Loopback API HTTP is supported locally; remote backend connections require HTTPS. Physical sensor calibration remains necessary.</text>
